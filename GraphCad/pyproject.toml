[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcad-diagram-editor"
version = "1.1.0"
description = "Native vector graph and economics diagram editor"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["PySide6==6.10.2", "ezdxf==1.4.5", "numpy==2.5.4", "fonttools==4.68.0", "pyparsing==3.3.3", "typing_extensions==4.16.0"]

[project.gui-scripts]
graphcad = "graphite.app:main"
graphite = "graphite.app:main"

[tool.setuptools.packages.find]
include = ["graphite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
